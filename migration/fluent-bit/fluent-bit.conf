# ============================================================================
# Fluent Bit: add an OpenObserve path without touching the existing one
# ----------------------------------------------------------------------------
# Dual-write: your existing [OUTPUT] blocks stay; you add one more.
#
# RECOMMENDED: send pods/containers to the OTel Collector's OTLP/HTTP port and
# let the collector handle auth + batching + fan-out. No credentials in Fluent
# Bit, and you get traces/metrics correlation for free.
# ============================================================================

[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Parser            docker
    Tag               kube.*
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

[FILTER]
    Name           kubernetes
    Match          kube.*
    Kube_URL       https://kubernetes.default.svc:443
    Merge_Log      On
    Keep_Log       Off
    K8S-Logging.Parser On
    K8S-Logging.Exclude On

# --- Existing destination (leave as-is during dual-write) ------------------
# [OUTPUT]
#     Name  datadog
#     Match *
#     ...

# --- NEW: forward to the OpenTelemetry Collector over OTLP/HTTP -------------
[OUTPUT]
    Name          opentelemetry
    Match         kube.*
    Host          otel-collector
    Port          4318
    http_uri      /v1/logs
    # Add resource attributes so logs slice nicely in OpenObserve.
    add_label     migration_phase dual-write
    add_label     environment     production

# ============================================================================
# ALTERNATIVE: write JSON straight to OpenObserve (no collector). Useful when
# you cannot deploy a collector, but you lose local batching and auth pooling.
#
# The endpoint is POST /api/<org>/<stream>/_json  (see migration/hec/README.md)
# ============================================================================
# [OUTPUT]
#     Name          http
#     Match         kube.*
#     Host          openobserve
#     Port          5080
#     URI           /api/default/k8s_logs/_json
#     Format        json
#     http_User     root@example.com
#     http_Passwd   Complexpass#123
#     tls           Off
#     json_date_key _timestamp
#     json_date_format iso8601
